<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SASAIMA · Visor unificado 2D / 3D — Campo Alegre</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0e13;color:#e8ecf1;font-family:Segoe UI,Arial,sans-serif}
  #view{position:fixed;inset:0}
  #panel{position:fixed;top:12px;left:12px;background:rgba(13,17,23,.9);border:1px solid #2a3340;border-radius:10px;padding:12px 14px;max-width:322px;max-height:calc(100% - 24px);overflow-y:auto}
  #panel h1{font-size:15px;margin:0 0 2px}
  #panel .sub{font-size:12px;color:#9fb0c3;margin-bottom:6px}
  #panel .sec{font-size:11px;color:#7f8ea1;margin:8px 0 2px;text-transform:uppercase;letter-spacing:.4px}
  #panel button{background:#1c2530;color:#e8ecf1;border:1px solid #33404f;border-radius:6px;padding:4px 9px;margin:3px 4px 3px 0;font-size:12px;cursor:pointer}
  #panel button.on{background:#0e5aa8;border-color:#0e5aa8}
  #panel label{font-size:12px;display:block;margin:3px 0;cursor:pointer}
  #panel .row{font-size:12px;margin:3px 0}
  #info{position:fixed;bottom:12px;left:12px;background:rgba(13,17,23,.9);border:1px solid #2a3340;border-radius:10px;padding:8px 12px;font-size:12px;max-width:380px}
  #legend{position:fixed;bottom:12px;right:12px;background:rgba(13,17,23,.9);border:1px solid #2a3340;border-radius:10px;padding:8px 12px;font-size:12px}
  .bar{height:10px;width:150px;border-radius:5px;background:linear-gradient(90deg,#2b6cb0,#38b26a,#e8c832,#c0392b);margin:4px 0}
</style>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>SASAIMA · Campo Alegre</h1>
  <div class="sub" id="stats">cargando…</div>
  <div class="sec">Modo</div>
  <div>
    <button id="m3d" class="on">3D Terreno</button><button id="m2d">2D Mapa</button>
  </div>
  <div>
    <button id="bDSM" class="on">Relieve DSM</button><button id="bDTM">Relieve DTM</button><button id="bOrto">Ortofoto</button>
  </div>
  <div>
    <button id="v3d" class="on">3D</button><button id="vtop">Cenital</button><button id="vrot">⟳ auto</button>
  </div>
  <div class="sec">Capas</div>
  <label><input type="checkbox" id="cOrto" checked> ortofoto 5 cm (textura 3D)</label>
  <label><input type="checkbox" id="cGray"> hillshade gris — solo 2D (sin color)</label>
  <label><input type="checkbox" id="cLind" checked> <span id="lblLind">lindero</span></label>
  <label><input type="checkbox" id="cCurv" checked> curvas de nivel 1 m (81)</label>
  <label><input type="checkbox" id="cCons" checked> construcciones (17)</label>
  <label><input type="checkbox" id="cCarr" checked> carreteras (3)</label>
  <label><input type="checkbox" id="cCol"> colindantes (7)</label>
  <label><input type="checkbox" id="cVert"> vértices lindero (40)</label>
  <label><input type="checkbox" id="cFoto" checked> fotocontrol + bases (6)</label>
  <label><input type="checkbox" id="cCart"> cartera estación (129)</label>
  <label><input type="checkbox" id="cCams" checked> <span id="lblCams">cámaras</span></label>
  <label><input type="checkbox" id="cPath" checked> trayectoria de vuelo</label>
  <label><input type="checkbox" id="cPts"> nube dispersa (59.181)</label>
  <label><input type="checkbox" id="cDense" checked> nube densa RGB</label>
  <div class="row">Punto: <input type="range" id="sSize" min="1" max="8" step="0.5" value="2.5" style="width:120px"></div>
  <div class="row" id="meta">Origen Nacional EPSG:9377 · norte arriba en 2D</div>
</div>
<div id="info">Clic en un cono naranja para ver la foto (etiqueta + posición ENU).</div>
<div id="legend">Altura (msnm)<div class="bar"></div><span id="zmin"></span> — <span id="zmax"></span></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="datos.js"></script>
<script src="datos_densa.js"></script>
<script src="terreno.js"></script>
<script src="vectores.js"></script>
<script src="hill_img.js"></script>
<script src="elev_img.js"></script>
<script src="orto_img.js"></script>
<script>
(function(){
  "use strict";
  var D = window.SASAIMA, T = window.TERRENO, V = window.VECTORES;
  var H0 = D.origen.h;
  var DENSA = (window.SASAIMA_DENSA && window.SASAIMA_DENSA.puntos) || [];

  // ---------- estado ----------
  var state = { mode: '3D', base: 'DSM' }; // base: DSM | DTM | ORTO
  var grid = function(){ return state.base === 'DTM' ? T.dtm : T.dsm; };

  // ---------- textos ----------
  var L = V.lindero;
  document.getElementById('lblLind').textContent =
    'lindero ' + L.predio + ' (' + L.area_ha.toFixed(4) + ' ha · ' + L.perim_m.toFixed(1) + ' m)';
  document.getElementById('lblCams').textContent = 'cámaras (' + D.camaras.length + ')';
  document.getElementById('stats').textContent =
    D.camaras.length + ' cámaras · ' + D.puntos.length.toLocaleString('es') +
    ' dispersos · ' + DENSA.length.toLocaleString('es') + ' densos · DSM/DTM 20 cm · orto 5 cm';
  var hmin = Infinity, hmax = -Infinity, _hh, _i;
  for (_i = 0; _i < T.dsm.h.length; _i++){ _hh = T.dsm.h[_i]; if (_hh < hmin) hmin = _hh; if (_hh > hmax) hmax = _hh; }
  for (_i = 0; _i < T.dtm.h.length; _i++){ _hh = T.dtm.h[_i]; if (_hh < hmin) hmin = _hh; if (_hh > hmax) hmax = _hh; }
  hmin += H0; hmax += H0;
  document.getElementById('zmin').textContent = hmin.toFixed(0) + ' m';
  document.getElementById('zmax').textContent = hmax.toFixed(0) + ' m';

  // ---------- three base ----------
  var g0 = T.dsm, W = g0.xmax - g0.xmin, H = g0.ymax - g0.ymin;
  var cx = (g0.xmin + g0.xmax) / 2, cy = (g0.ymin + g0.ymax) / 2;
  function T3(x, y, z){ return new THREE.Vector3(x, z, -y); } // ENU -> three

  var renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setSize(innerWidth, innerHeight);
  document.getElementById('view').appendChild(renderer.domElement);
  var scene = null, camera = null, controls = null, animId = 0;
  var pickables = [], matPts = [], info = document.getElementById('info');

  // ---------- texturas (precarga) ----------
  var texLoader = new THREE.TextureLoader();
  function loadTex(url){
    return texLoader.loadAsync(url).then(function(t){
      t.anisotropy = 4; t.colorSpace = THREE.SRGBColorSpace; return t;
    });
  }
  var TEX = {};
  Promise.all([
    loadTex(window.ORTO_IMG).then(function(t){ TEX.orto = t; }),
    loadTex(window.DSM_ELEV).then(function(t){ TEX.dsm = t; }),
    loadTex(window.DTM_ELEV).then(function(t){ TEX.dtm = t; }),
    loadTex(window.DSM_HILL).then(function(t){ TEX.dsmH = t; }),
    loadTex(window.DTM_HILL).then(function(t){ TEX.dtmH = t; })
  ]).then(function(){ build(); }).catch(function(e){ info.textContent = 'Error cargando texturas: ' + e; });

  // ---------- muestreo bilineal de grilla (z relativa) ----------
  function sampleGrid(g, x, y){
    var fx = (x - g.xmin) / (g.xmax - g.xmin) * (g.nx - 1);
    var fy = (g.ymax - y) / (g.ymax - g.ymin) * (g.ny - 1);
    var x0 = Math.floor(fx), y0 = Math.floor(fy);
    if (x0 < 0 || y0 < 0 || x0 >= g.nx - 1 || y0 >= g.ny - 1){
      x0 = Math.max(0, Math.min(g.nx - 1, x0)); y0 = Math.max(0, Math.min(g.ny - 1, y0));
      return g.h[y0 * g.nx + x0];
    }
    var tx = fx - x0, ty = fy - y0, i = y0 * g.nx + x0;
    var a = g.h[i], b = g.h[i + 1], c = g.h[i + g.nx], d = g.h[i + g.nx + 1];
    return a * (1 - tx) * (1 - ty) + b * tx * (1 - ty) + c * (1 - tx) * ty + d * tx * ty;
  }
  var LIFT = 0.6; // realce anti z-fight de vectores

  // ---------- constructores ----------
  function meshTerreno(g, tex, plain){
    var nx = g.nx, ny = g.ny, Hh = g.h;
    var dx = (g.xmax - g.xmin) / (nx - 1), dy = (g.ymax - g.ymin) / (ny - 1);
    var pos = new Float32Array(nx * ny * 3), uv = new Float32Array(nx * ny * 2);
    for (var j = 0; j < ny; j++) for (var i = 0; i < nx; i++){
      var k = j * nx + i;
      pos[k*3] = g.xmin + i * dx; pos[k*3+1] = Hh[k]; pos[k*3+2] = -(g.ymax - j * dy);
      uv[k*2] = i / (nx - 1); uv[k*2+1] = 1 - j / (ny - 1);
    }
    var idx = [];
    for (var jj = 0; jj < ny - 1; jj++) for (var ii = 0; ii < nx - 1; ii++){
      var a = jj * nx + ii, b = a + 1, c = a + nx, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    geo.setIndex(idx); geo.computeVertexNormals();
    var mat = plain
      ? new THREE.MeshLambertMaterial({color: 0x9a8f7a})
      : new THREE.MeshLambertMaterial({map: tex});
    var m = new THREE.Mesh(geo, mat);
    m.frustumCulled = false;
    m.userData.tex = tex || null;
    return m;
  }
  function plano2D(tex){
    var m = new THREE.Mesh(new THREE.PlaneGeometry(W, H),
      new THREE.MeshBasicMaterial({map: tex, transparent: true}));
    m.rotation.x = -Math.PI / 2;
    m.position.set(cx, 0, -cy);
    m.frustumCulled = false;
    return m;
  }
  function linea3D(pts2, color, zOverride){
    var g = grid();
    var v = pts2.map(function(p){
      var z = (zOverride !== undefined) ? zOverride : sampleGrid(g, p[0], p[1]) + LIFT;
      return T3(p[0], p[1], z);
    });
    var l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(v),
      new THREE.LineBasicMaterial({color: color}));
    l.frustumCulled = false;
    return l;
  }
  function puntos3D(lista, color, size, zDeLista){
    // lista: [{p:[x,y,z]}] o [[x,y,z]]
    var n = lista.length, pos = new Float32Array(n * 3);
    for (var i = 0; i < n; i++){
      var p = lista[i].p || lista[i];
      var z = (p.length > 2 && zDeLista) ? p[2] : sampleGrid(grid(), p[0], p[1]) + LIFT;
      pos[i*3] = p[0]; pos[i*3+1] = z; pos[i*3+2] = -p[1];
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var m = new THREE.PointsMaterial({size: size, color: color, sizeAttenuation: false});
    matPts.push(m);
    var pts = new THREE.Points(geo, m);
    pts.frustumCulled = false;
    return pts;
  }

  // ---------- nubes y cámaras ----------
  function nubeDispersa(){
    var pts = D.puntos, n = pts.length;
    var zs = pts.map(function(p){ return p[2]; });
    var zmin = Math.min.apply(null, zs), zmax = Math.max.apply(null, zs);
    var pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
    var c1 = new THREE.Color(), cA = new THREE.Color(0x2b6cb0), cB = new THREE.Color(0x38b26a),
        cC = new THREE.Color(0xe8c832), cD = new THREE.Color(0xc0392b);
    for (var i = 0; i < n; i++){
      var p = pts[i];
      pos[i*3] = p[0]; pos[i*3+1] = p[2]; pos[i*3+2] = -p[1];
      var t = (p[2] - zmin) / Math.max(1e-6, zmax - zmin);
      if (t < 0.33) c1.copy(cA).lerp(cB, t / 0.33);
      else if (t < 0.66) c1.copy(cB).lerp(cC, (t - 0.33) / 0.33);
      else c1.copy(cC).lerp(cD, (t - 0.66) / 0.34);
      col[i*3] = c1.r; col[i*3+1] = c1.g; col[i*3+2] = c1.b;
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    var m = new THREE.PointsMaterial({size: 2.5, vertexColors: true, sizeAttenuation: true});
    matPts.push(m);
    var o = new THREE.Points(geo, m); o.frustumCulled = false;
    return o;
  }
  function nubeDensa(){
    if (!DENSA.length) return null;
    var n = DENSA.length;
    var pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
    for (var j = 0; j < n; j++){
      var q = DENSA[j];
      pos[j*3] = q[0]; pos[j*3+1] = q[2]; pos[j*3+2] = -q[1];
      col[j*3] = q[3] / 255; col[j*3+1] = q[4] / 255; col[j*3+2] = q[5] / 255;
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    var m = new THREE.PointsMaterial({size: 2.5, vertexColors: true, sizeAttenuation: true});
    matPts.push(m);
    var o = new THREE.Points(geo, m); o.frustumCulled = false;
    return o;
  }
  function grupoCamaras(){
    var grp = new THREE.Group(), up = new THREE.Vector3(0, 1, 0);
    D.camaras.forEach(function(c){
      var P = T3(c.pos[0], c.pos[1], c.pos[2]);
      var dir = new THREE.Vector3(c.dir[0], c.dir[2], -c.dir[1]).normalize();
      var cone = new THREE.Mesh(new THREE.ConeGeometry(2.2, 9, 8),
        new THREE.MeshBasicMaterial({color: 0xff8c1a}));
      cone.position.copy(P).addScaledVector(dir, 4.5);
      cone.quaternion.setFromUnitVectors(up, dir.clone().negate());
      cone.userData = c;
      grp.add(cone); pickables.push(cone);
    });
    return grp;
  }

  // ---------- armado por modo ----------
  var refs = {};
  function texBase2D(){
    var gris = document.getElementById('cGray').checked;
    if (state.base === 'DSM') return gris ? TEX.dsmH : TEX.dsm;
    if (state.base === 'DTM') return gris ? TEX.dtmH : TEX.dtm;
    return TEX.orto;
  }
  function build(){
    if (controls) controls.dispose();
    cancelAnimationFrame(animId);
    matPts = []; pickables = [];
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0e13);
    refs = {};
    var is3D = state.mode === '3D';

    if (is3D){
      camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 20000);
      scene.add(new THREE.AmbientLight(0xffffff, 0.75));
      var sun = new THREE.DirectionalLight(0xffffff, 0.75);
      sun.position.set(-300, 500, 200); scene.add(sun);
      var g = grid();
      var usaOrto = document.getElementById('cOrto').checked;
      refs.terreno = meshTerreno(g, usaOrto ? TEX.orto : null, !usaOrto);
      scene.add(refs.terreno);
    } else {
      var aspect = innerWidth / innerHeight, viewH = H * 1.12;
      camera = new THREE.OrthographicCamera(-viewH * aspect / 2, viewH * aspect / 2, viewH / 2, -viewH / 2, -100, 1000);
      camera.position.set(cx, 100, -cy);
      camera.up.set(0, 0, -1);
      camera.lookAt(cx, 0, -cy);
      refs.terreno = plano2D(texBase2D());
      scene.add(refs.terreno);
    }

    // vectores (3D drapeados / 2D se ven cenital igual)
    var gL = grid();
    refs.lind = linea3D(L.linea.map(function(p){ return [p[0], p[1]]; }), 0xff2222);
    scene.add(refs.lind);
    refs.curvas = new THREE.Group();
    V.curvas.forEach(function(c){ refs.curvas.add(linea3D(c.pts, 0xc98a3b, c.z + 0.3)); });
    scene.add(refs.curvas);
    refs.cons = new THREE.Group();
    V.construcciones.forEach(function(f){
      f.rings.forEach(function(r){ refs.cons.add(linea3D(r, 0xffcc66)); });
    });
    scene.add(refs.cons);
    refs.col = new THREE.Group();
    V.colindantes.forEach(function(f){
      (f.rings || []).forEach(function(r){ refs.col.add(linea3D(r, 0xff44ff)); });
    });
    scene.add(refs.col);
    refs.carr = new THREE.Group();
    V.carreteras.forEach(function(f){ refs.carr.add(linea3D(f.pts, 0x35c4ff)); });
    scene.add(refs.carr);
    refs.vert = puntos3D(V.vertices_lindero, 0xff2222, 5, false); scene.add(refs.vert);
    refs.foto = puntos3D(V.fotocontrol, 0xffff00, 7, false); scene.add(refs.foto);
    refs.cart = puntos3D(V.cartera, 0x35c4ff, 4, false); scene.add(refs.cart);
    refs.base = puntos3D(V.puntos_base, 0xffffff, 7, false); scene.add(refs.base);

    // nubes + cámaras + trayectoria
    refs.disp = nubeDispersa(); refs.disp.visible = false; scene.add(refs.disp);
    refs.densa = nubeDensa(); if (refs.densa) scene.add(refs.densa);
    refs.cams = grupoCamaras(); scene.add(refs.cams);
    var pathPts = D.camaras.map(function(c){ return T3(c.pos[0], c.pos[1], c.pos[2]); });
    refs.path = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pathPts),
      new THREE.LineBasicMaterial({color: 0x35c4ff}));
    refs.path.frustumCulled = false;
    scene.add(refs.path);

    aplicarVisibilidad();

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    if (is3D){
      controls.enableDamping = true;
      controls.target.set(cx, 10, -cy);
      camera.position.set(cx + 320, 330, -cy + 420);
    } else {
      controls.enableRotate = false;
      controls.mouseButtons = {LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN};
      controls.target.set(cx, 0, -cy);
    }
    controls.update();
    document.getElementById('vrot').style.display = is3D ? '' : 'none';

    var ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
    renderer.domElement.onclick = function(ev){
      mouse.x = (ev.clientX / innerWidth) * 2 - 1; mouse.y = -(ev.clientY / innerHeight) * 2 + 1;
      ray.setFromCamera(mouse, camera);
      var hit = ray.intersectObjects(pickables)[0];
      if (hit){
        var c = hit.object.userData;
        info.innerHTML = '<b>' + c.label + '.JPG</b> · E ' + c.pos[0].toFixed(1) +
          ' N ' + c.pos[1].toFixed(1) + ' h +' + c.pos[2].toFixed(1) +
          ' m (ENU) · ' + (H0 + c.pos[2]).toFixed(1) + ' msnm aprox';
      }
    };
    (function anim(){ animId = requestAnimationFrame(anim); controls.update(); renderer.render(scene, camera); })();
  }

  function aplicarVisibilidad(){
    if (!refs.terreno) return;
    var get = function(id){ return document.getElementById(id).checked; };
    refs.lind.visible = get('cLind');
    refs.curvas.visible = get('cCurv');
    refs.cons.visible = get('cCons');
    refs.col.visible = get('cCol');
    refs.carr.visible = get('cCarr');
    refs.vert.visible = get('cVert');
    refs.foto.visible = get('cFoto');
    refs.cart.visible = get('cCart');
    refs.base.visible = get('cFoto');
    refs.cams.visible = get('cCams');
    refs.path.visible = get('cPath');
    refs.disp.visible = get('cPts');
    if (refs.densa) refs.densa.visible = get('cDense');
    if (state.mode === '3D'){
      var usaOrto = get('cOrto');
      refs.terreno.material.map = usaOrto ? refs.terreno.userData.tex : null;
      refs.terreno.material.needsUpdate = true;
    }
  }

  // ---------- UI ----------
  function setBase(b){
    state.base = b;
    ['bDSM', 'bDTM', 'bOrto'].forEach(function(id){ document.getElementById(id).classList.remove('on'); });
    document.getElementById(b === 'DSM' ? 'bDSM' : b === 'DTM' ? 'bDTM' : 'bOrto').classList.add('on');
    if (state.mode === '2D'){ refs.terreno.material.map = texBase2D(); refs.terreno.material.needsUpdate = true; }
    else { if (b === 'ORTO') document.getElementById('cOrto').checked = true; build(); }
  }
  document.getElementById('bDSM').onclick = function(){ setBase('DSM'); };
  document.getElementById('bDTM').onclick = function(){ setBase('DTM'); };
  document.getElementById('bOrto').onclick = function(){ setBase('ORTO'); };
  function setMode(m){
    state.mode = m;
    document.getElementById('m3d').classList.toggle('on', m === '3D');
    document.getElementById('m2d').classList.toggle('on', m === '2D');
    if (m === '2D' && state.base === 'ORTO'){ /* se mantiene orto */ }
    build();
  }
  document.getElementById('m3d').onclick = function(){ setMode('3D'); };
  document.getElementById('m2d').onclick = function(){ setMode('2D'); };
  document.getElementById('v3d').onclick = function(){
    if (state.mode !== '3D') setMode('3D');
    else { controls.target.set(cx, 10, -cy); camera.position.set(cx + 320, 330, -cy + 420); }
  };
  document.getElementById('vtop').onclick = function(){
    if (state.mode === '3D'){ controls.target.set(cx, 10, -cy); camera.position.set(cx, 900, -cy + 1); }
    else { camera.position.set(cx, 100, -cy); controls.target.set(cx, 0, -cy); }
  };
  var rot = false;
  document.getElementById('vrot').onclick = function(){
    rot = !rot; controls.autoRotate = rot; controls.autoRotateSpeed = 1.2; this.classList.toggle('on', rot);
  };
  ['cOrto', 'cLind', 'cCurv', 'cCons', 'cCarr', 'cCol', 'cVert', 'cFoto', 'cCart',
   'cCams', 'cPath', 'cPts', 'cDense'].forEach(function(id){
    document.getElementById(id).onchange = aplicarVisibilidad;
  });
  document.getElementById('cGray').onchange = function(){
    if (state.mode === '2D'){ refs.terreno.material.map = texBase2D(); refs.terreno.material.needsUpdate = true; }
  };
  document.getElementById('sSize').oninput = function(){
    var v = parseFloat(this.value);
    matPts.forEach(function(m){ m.size = v; });
  };
  addEventListener('resize', function(){
    if (!camera) return;
    if (state.mode === '3D'){
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    } else {
      var a = innerWidth / innerHeight, vh = (camera.top - camera.bottom);
      camera.left = -vh * a / 2; camera.right = vh * a / 2;
      camera.updateProjectionMatrix();
    }
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
