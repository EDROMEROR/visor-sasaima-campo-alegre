<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SASAIMA · Visor 2D (hillshade + lindero)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0e13;color:#e8ecf1;font-family:Segoe UI,Arial,sans-serif}
  #view{position:fixed;inset:0}
  #panel{position:fixed;top:12px;left:12px;background:rgba(13,17,23,.88);border:1px solid #2a3340;border-radius:10px;padding:12px 14px;max-width:280px}
  #panel h1{font-size:15px;margin:0 0 4px}
  #panel .sub{font-size:12px;color:#9fb0c3;margin-bottom:8px}
  #panel button{background:#1c2530;color:#e8ecf1;border:1px solid #33404f;border-radius:6px;padding:4px 9px;margin:3px 4px 3px 0;font-size:12px;cursor:pointer}
  #panel button.on{background:#0e5aa8;border-color:#0e5aa8}
  #panel label{font-size:12px;display:block;margin:3px 0}
  #scale{position:fixed;bottom:12px;left:12px;background:rgba(13,17,23,.88);border:1px solid #2a3340;border-radius:8px;padding:6px 10px;font-size:12px}
</style>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>SASAIMA · Mapa 2D</h1>
  <div class="sub">Relieve DSM/DTM + ortofoto + lindero (arrastrar: mover · rueda: zoom)</div>
  <div>
    <button id="bDSM" class="on">Relieve DSM</button><button id="bDTM">Relieve DTM</button><button id="bOrto">Ortofoto</button>
  </div>
  <label><input type="checkbox" id="cGray"> hillshade gris (sin color)</label>
  <label><input type="checkbox" id="cLind" checked> lindero Campo Alegre (0.2425 ha)</label>
  <label><input type="checkbox" id="cPts"> puntos cartera (129)</label>
</div>
<div id="scale">Origen Nacional · norte arriba</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="datos.js"></script>
<script src="terreno.js"></script>
<script src="lindero.js"></script>
<script src="hill_img.js"></script>
<script src="elev_img.js"></script>
<script src="orto_img.js"></script>
<script>
(function(){
  var D = window.SASAIMA, T = window.TERRENO;
  var g = T.dsm, W = g.xmax - g.xmin, H = g.ymax - g.ymin;
  var cx = (g.xmin + g.xmax) / 2, cy = (g.ymin + g.ymax) / 2;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0e13);
  var aspect = innerWidth / innerHeight;
  var viewH = H * 1.12;
  var camera = new THREE.OrthographicCamera(-viewH * aspect / 2, viewH * aspect / 2, viewH / 2, -viewH / 2, -100, 1000);
  camera.position.set(cx, 100, -cy);
  camera.up.set(0, 0, -1);
  camera.lookAt(cx, 0, -cy);
  var renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setSize(innerWidth, innerHeight);
  document.getElementById('view').appendChild(renderer.domElement);
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableRotate = false;
  controls.mouseButtons = {LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN};
  controls.target.set(cx, 0, -cy);
  controls.update();

  var texLoader = new THREE.TextureLoader();
  function plano(url){
    var geo = new THREE.PlaneGeometry(W, H);
    var m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({transparent: true}));
    m.rotation.x = -Math.PI / 2;
    m.position.set(cx, 0, -cy);
    m.frustumCulled = false;
    // orientar textura: u este, v norte (flipY)
    texLoader.load(url, function(tex){
      m.material.map = tex;
      m.material.needsUpdate = true;
    });
    m.visible = false;
    scene.add(m);
    return m;
  }
  var lDSM = plano(window.DSM_ELEV), lDTM = plano(window.DTM_ELEV), lOrto = plano(window.ORTO_IMG);
  lDSM.visible = true;
  var GRIS = false;
  function texFor(cual){
    if (cual === 'DSM') return GRIS ? window.DSM_HILL : window.DSM_ELEV;
    if (cual === 'DTM') return GRIS ? window.DTM_HILL : window.DTM_ELEV;
    return window.ORTO_IMG;
  }
  function refrescar(){
    var cur = lDSM.visible ? 'DSM' : (lDTM.visible ? 'DTM' : 'ORTO');
    [lDSM, lDTM, lOrto].forEach(function(l){ l.visible = false; });
    var url = texFor(cur);
    var lay = cur === 'DSM' ? lDSM : (cur === 'DTM' ? lDTM : lOrto);
    texLoader.load(url, function(tex){
      lay.material.map = tex;
      lay.material.needsUpdate = true;
      lay.visible = true;
    });
  }
  document.getElementById('cGray').onchange = function(){ GRIS = this.checked; refrescar(); };
  function modo(cual){
    var lay = cual === 'DSM' ? lDSM : (cual === 'DTM' ? lDTM : lOrto);
    lDSM.visible = false;
    lDTM.visible = false;
    lOrto.visible = false;
    texLoader.load(texFor(cual), function(tex){
      lay.material.map = tex;
      lay.material.needsUpdate = true;
      lay.visible = true;
    });
    document.getElementById('bDSM').classList.toggle('on', cual === 'DSM');
    document.getElementById('bDTM').classList.toggle('on', cual === 'DTM');
    document.getElementById('bOrto').classList.toggle('on', cual === 'ORTO');
  }
  document.getElementById('bDSM').onclick = function(){ modo('DSM'); };
  document.getElementById('bDTM').onclick = function(){ modo('DTM'); };
  document.getElementById('bOrto').onclick = function(){ modo('ORTO'); };

  // lindero (plano, E/N -> three)
  var lp = window.LINDERO.linea.map(function(p){ return new THREE.Vector3(p[0], 1.5, -p[1]); });
  var lind = new THREE.Line(new THREE.BufferGeometry().setFromPoints(lp),
    new THREE.LineBasicMaterial({color: 0xff2222}));
  lind.frustumCulled = false;
  scene.add(lind);
  document.getElementById('cLind').onchange = function(){ lind.visible = this.checked; };

  // puntos
  var pts = D.puntos, n = pts.length;
  var pos = new Float32Array(n * 3);
  for (var i = 0; i < n; i++){ pos[i*3] = pts[i][0]; pos[i*3+1] = 1.0; pos[i*3+2] = -pts[i][1]; }
  var pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  var cloud = new THREE.Points(pg, new THREE.PointsMaterial({size: 3, color: 0x35c4ff, sizeAttenuation: false}));
  cloud.visible = false;
  cloud.frustumCulled = false;
  scene.add(cloud);
  document.getElementById('cPts').onchange = function(){ cloud.visible = this.checked; };

  addEventListener('resize', function(){
    var a = innerWidth / innerHeight, vh = (camera.top - camera.bottom);
    camera.left = -vh * a / 2; camera.right = vh * a / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  (function anim(){ requestAnimationFrame(anim); controls.update(); renderer.render(scene, camera); })();
})();
</script>
</body>
</html>
